<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101216" />
    <title>BatGram — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101216; color: #f2f3f5; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      img { width: 80px; height: 80px; border-radius: 20px; }
      h1 { font-size: 1.75rem; }
      p { color: #a6acb8; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.5rem; border-radius: .75rem; background: #f5c518; color: #101216; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>BatGram is offline</h1>
      <p>Reconnect to open your chats and send messages. Your account and messages need an internet connection.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
